{% extends 'base.html' %}
{% block content %}
<div class="analysis-grid">
  <section class="panel-card" style="grid-column: span 8;">
    <div class="section-title">
      <div>
        <h3>Add Sale</h3>
        <p>Record a new transaction directly into the sales database.</p>
      </div>
      <a class="btn btn-secondary" href="/sales-history">View history</a>
    </div>

    {% if error %}
    <div class="panel-card" style="border-color: rgba(220, 38, 38, 0.2); color: #991b1b;">
      <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="panel-card" style="border-color: rgba(34, 197, 94, 0.2); color: #166534;">
      {{ success }}
    </div>
    {% endif %}

    <form id="add-sale-form" method="post" class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" name="product" value="{{ sale.product }}" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category">
            {% for category in categories %}
            <option value="{{ category }}" {{ 'selected' if sale.category == category else '' }}>{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" name="customer_name" value="{{ sale.customer_name }}" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Quantity</label>
          <input id="quantity" type="number" name="quantity" min="1" step="1" value="{{ sale.quantity }}" required />
        </div>
        <div class="form-group">
          <label>Cost Price per Unit</label>
          <input id="cost-price" type="number" name="cost_price" min="0" step="0.01" value="{{ sale.cost_price }}" required />
        </div>
        <div class="form-group">
          <label>Selling Price per Unit</label>
          <input id="selling-price" type="number" name="selling_price" min="0" step="0.01" value="{{ sale.selling_price }}" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Discount (%)</label>
          <input id="discount" type="number" name="discount" min="0" max="100" step="0.01" value="{{ sale.discount }}" required />
        </div>
        <div class="form-group">
          <label>Discount Amount</label>
          <input id="discount-amount" type="text" value="₹{{ '%.2f' % sale.discount_amount }}" disabled />
        </div>
        <div class="form-group">
          <label>Estimated Total Sales</label>
          <input id="estimated-total-sales" type="text" value="₹{{ '%.2f' % ((sale.quantity * sale.selling_price) - sale.discount_amount if sale.quantity and sale.selling_price is not none else 0) }}" disabled />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Sale Date</label>
          <input type="date" name="sale_date" value="{{ sale.sale_date }}" required />
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select name="payment_method">
            {% for payment in payments %}
            <option value="{{ payment }}" {{ 'selected' if sale.payment_method == payment else '' }}>{{ payment }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <button id="save-sale-button" class="btn btn-primary" type="submit">Save sale</button>
    </form>
  </section>
</div>

<script>
const quantityInput = document.getElementById('quantity');
const sellingPriceInput = document.getElementById('selling-price');
const discountInput = document.getElementById('discount');
const discountAmountInput = document.getElementById('discount-amount');
const estimatedTotalSalesInput = document.getElementById('estimated-total-sales');
const addSaleForm = document.getElementById('add-sale-form');
const saveSaleButton = document.getElementById('save-sale-button');

function formatINR(value) {
  const amount = Number(value) || 0;
  return '₹' + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function updateEstimatedSales() {
  const quantity = Number(quantityInput.value) || 0;
  const sellingPrice = Number(sellingPriceInput.value) || 0;
  const discountPercent = Number(discountInput.value) || 0;
  const grossSales = quantity * sellingPrice;
  const discountAmount = grossSales * (discountPercent / 100);
  const estimatedTotal = grossSales - discountAmount;

  discountAmountInput.value = formatINR(discountAmount);
  estimatedTotalSalesInput.value = formatINR(estimatedTotal);
}

if (quantityInput && sellingPriceInput && discountInput) {
  quantityInput.addEventListener('input', updateEstimatedSales);
  sellingPriceInput.addEventListener('input', updateEstimatedSales);
  discountInput.addEventListener('input', updateEstimatedSales);
  updateEstimatedSales();
}

if (addSaleForm && saveSaleButton) {
  addSaleForm.addEventListener('submit', () => {
    saveSaleButton.disabled = true;
    saveSaleButton.textContent = 'Saving...';
  });
}
</script>
{% endblock %}
