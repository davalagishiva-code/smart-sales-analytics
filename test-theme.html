<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme System Test</title>
    <link rel="stylesheet" href="static/css/themes.css">
    <link rel="stylesheet" href="static/css/ui.css">
    <script src="static/js/theme-manager.js"></script>
    <style>
        body {
            padding: 40px;
        }
        .test-section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin: 20px 0;
        }
        h1, h2 {
            color: var(--text);
        }
        p {
            color: var(--text-muted);
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        .color-box {
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-weight: bold;
            border: 1px solid var(--border);
        }
        .btn-test {
            background: var(--brand);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-test:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--card-shadow);
        }
    </style>
</head>
<body>
    <h1>Smart Sales Analytics - Theme System Test</h1>
    <p>Testing the theme system implementation</p>

    <div class="test-section">
        <h2>Available Themes</h2>
        <button class="btn-test" onclick="themeManager.setTheme('light')">Light Theme</button>
        <button class="btn-test" onclick="themeManager.setTheme('black')">Black Theme</button>
        <button class="btn-test" onclick="themeManager.setTheme('grey')">Grey Theme</button>
        <button class="btn-test" onclick="themeManager.setTheme('white')">White Theme</button>
        <button class="btn-test" onclick="themeManager.setTheme('bw')">Black & White Theme</button>
    </div>

    <div class="test-section">
        <h2>Current Theme Colors</h2>
        <div class="color-grid">
            <div class="color-box" style="background: var(--bg);">Background</div>
            <div class="color-box" style="background: var(--panel);">Panel</div>
            <div class="color-box" style="background: var(--brand);">Brand</div>
            <div class="color-box" style="background: var(--text); color: var(--panel);">Text</div>
            <div class="color-box" style="background: var(--success);">Success</div>
            <div class="color-box" style="background: var(--danger);">Danger</div>
        </div>
    </div>

    <div class="test-section">
        <h2>Other Settings</h2>
        <p>Current Layout: <strong id="layoutDisplay"></strong></p>
        <p>Current Font Size: <strong id="fontSizeDisplay"></strong></p>
        <p>Notifications Enabled: <strong id="notificationsDisplay"></strong></p>
        <p>Sidebar Collapsed: <strong id="sidebarDisplay"></strong></p>
    </div>

    <script>
        // Display current settings
        function updateDisplay() {
            document.getElementById('layoutDisplay').textContent = themeManager.getLayout();
            document.getElementById('fontSizeDisplay').textContent = themeManager.getFontSize();
            document.getElementById('notificationsDisplay').textContent = themeManager.areNotificationsEnabled();
            document.getElementById('sidebarDisplay').textContent = themeManager.isSidebarCollapsed();
        }

        // Update display on page load
        if (typeof themeManager !== 'undefined') {
            updateDisplay();
            console.log('Theme System Test Page Loaded Successfully');
            console.log('Current Theme:', themeManager.getTheme());
        } else {
            console.error('Theme Manager not loaded');
        }
    </script>
</body>
</html>
